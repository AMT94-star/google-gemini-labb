<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gemini questions and answers</title>
</head>
<body>

<form th:action="@{/request}" method="post">
    <input type="text" name="prompt" placeholder="Enter a question">
    <button type="submit">Submit</button>
</form>

<div th:if="${answer}">
    <h2>Question</h2>
    <p th:text="${question}"></p>

    <h2>Answer</h2>
    <p th:text="${answer}"></p>
</div>

</body>
</html>
